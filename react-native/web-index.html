<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JustinBot - Web Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #fff;
            padding: 16px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 20px;
            color: #333;
        }
        .clear-btn {
            background: none;
            border: none;
            color: #007AFF;
            font-size: 16px;
            cursor: pointer;
            padding: 8px;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .message {
            margin-bottom: 12px;
            display: flex;
        }
        .message.user {
            justify-content: flex-end;
        }
        .message.bot {
            justify-content: flex-start;
        }
        .bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            word-wrap: break-word;
        }
        .message.bot .bubble {
            background: #fff;
            color: #333;
            border-bottom-left-radius: 4px;
        }
        .message.user .bubble {
            background: #007AFF;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.crisis .bubble {
            background: #fff5f5;
            border-left: 3px solid #ff4444;
        }
        .input-area {
            background: #fff;
            border-top: 1px solid #e0e0e0;
            padding: 12px;
            display: flex;
            gap: 8px;
        }
        .input-area input {
            flex: 1;
            background: #f5f5f5;
            border: none;
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 16px;
            outline: none;
        }
        .send-btn {
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>JustinBot</h1>
        <button class="clear-btn" onclick="clearHistory()">Clear</button>
    </div>
    
    <div class="messages" id="messages"></div>
    
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Type a message..." maxlength="500" onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <script type="module">
        import EmpathyAI from './src/EmpathyAI.js';
        
        window.ai = new EmpathyAI('User', 'empathetic');
        
        // Add welcome message
        addMessage('Hi, I am JustinBot! How can I help you?', 'bot');
        
        window.sendMessage = function() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text) return;
            
            addMessage(text, 'user');
            input.value = '';
            
            // Check for termination phrases
            const terminationPattern = /^(?:can\s+i\s+end\s+the\s+conversation|end\s+the\s+conversation|i\s+want\s+to\s+end\s+the\s+conversation|i\s+don'?t\s+want\s+to\s+talk\s+anymore|can\s+this\s+conversation\s+be\s+ended)\??$/i;
            
            if (terminationPattern.test(text)) {
                if (confirm('Are you sure you want to end the conversation?')) {
                    const goodbye = "Goodbye — I hope you're doing okay. Take care of yourself.";
                    window.ai.history.addMessage('assistant', goodbye);
                    addMessage(goodbye, 'bot');
                    return;
                } else {
                    addMessage("Okay, let's continue. How can I help you?", 'bot');
                    return;
                }
            }
            
            // Process with AI
            try {
                const result = window.ai.processMessage(text);
                const isCrisis = result.severity === 'critical';
                addMessage(result.response, 'bot', isCrisis);
                
                if (isCrisis) {
                    setTimeout(() => {
                        if (confirm('Would you like to see crisis hotline numbers?')) {
                            showCrisisResources();
                        }
                    }, 1000);
                }
            } catch (error) {
                addMessage('Sorry, I encountered an error processing your message.', 'bot');
            }
        };
        
        window.handleKeyPress = function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        };
        
        function addMessage(text, sender, isCrisis = false) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}` + (isCrisis ? ' crisis' : '');
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            
            messageDiv.appendChild(bubble);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        window.addMessage = addMessage;
        
        function showCrisisResources() {
            const resources = window.ai.safetyFilter.getCrisisResources('US');
            alert(`Crisis Resources:\n\nSuicide & Crisis Lifeline: ${resources.suicideHotline}\n\nCrisis Text Line: ${resources.crisisText}\n\nPlease reach out for help.`);
        }
        
        window.clearHistory = function() {
            if (confirm('Are you sure you want to clear all conversation history?')) {
                window.ai.history.clearHistory();
                document.getElementById('messages').innerHTML = '';
                addMessage('Hi, I am JustinBot! How can I help you?', 'bot');
            }
        };
    </script>
</body>
</html>
